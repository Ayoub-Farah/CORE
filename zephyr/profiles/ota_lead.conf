CONFIG_OWNTECH_COMMUNICATION=y
CONFIG_OWNTECH_COMMUNICATION_ENABLE_CAN=y
CONFIG_CAN_FD_MODE=n
# OTA sends reports only for an explicit operation; no idle mLive timer/traffic.
CONFIG_THINGSET_SUBSET_LIVE_METRICS=n
# Background service priorities; control interrupts preempt these threads.
CONFIG_THINGSET_CAN_THREAD_PRIORITY=10
CONFIG_THINGSET_SDK_THREAD_PRIORITY=10
CONFIG_THINGSET_CAN_REPORT_RX=y
CONFIG_THINGSET_CAN_REPORT_RX_BUFFER_SIZE=512
CONFIG_THINGSET_DFU=n
CONFIG_THINGSET_BYTES_TYPE_SUPPORT=y
CONFIG_THINGSET_CAN_ALLOW_ADDRESS_WRITE=n
CONFIG_OWNTECH_OTA=y
CONFIG_OWNTECH_OTA_LEAD=y
CONFIG_OWNTECH_OTA_STACK_SIZE=8192
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="ota_mbedtls_config.h"
CONFIG_MCUMGR=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_TRANSPORT_UART=y
# Exact padded uploads always use the campaign's shared writer. No independent
# standard image writer/erase/test/confirm handler is exposed.
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_OS=n
CONFIG_USB_COMPOSITE_DEVICE=y
# CDC UART callbacks run in USB_WORK_Q. Buffered console RX can overflow into
# tty_putchar(), whose blocking TX wait deadlocks that shared workqueue. Keep
# console input available via polling; the dedicated SMP CDC still uses IRQ RX.
CONFIG_CONSOLE_GETCHAR_BUFSIZE=0
CONFIG_BASE64=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1536
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=3
CONFIG_MCUMGR_TRANSPORT_UART_MTU=1536
CONFIG_MCUMGR_SMP_CBOR_MAX_DECODING_LEVELS=4
CONFIG_MCUMGR_SMP_CBOR_MAX_ENCODING_LEVELS=4
CONFIG_MCUMGR_SMP_CBOR_MAX_MAIN_MAP_ENTRIES=40
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_THINGSET_CAN_RX_BUF_SIZE=768
CONFIG_THINGSET_CAN_TX_BUF_SIZE=768
CONFIG_THINGSET_CAN_REPORT_RX_NUM_BUFFERS=4
CONFIG_OWNTECH_OTA_USABLE_SLOT_SIZE=221184
CONFIG_OWNTECH_OTA_HARDWARE_ID=0x01020142
CONFIG_OWNTECH_OTA_LAYOUT_ID=0x00010001
CONFIG_OWNTECH_OTA_BOOTLOADER_ID=0x00010100

CONFIG_THINGSET_TEXT_MODE=n
CONFIG_THINGSET_CAN_CLIENT=y
