name: PlatformIO and OTA validation

on: [push, pull_request]

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test production transport, state machines, storage and PC client
        run: python -m unittest discover -s tests/ota -p '*test*.py' -v

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [USB, CAN_BASELINE, USB_LEAD, OTA_BLINK_A, OTA_BLINK_B]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install platformio==6.2.0 pyyaml
      - name: Build and sign using the existing MCUboot chain
        run: pio run -e ${{ matrix.environment }}
      - name: Verify native USB CBOR against installed Zephyr dependencies
        if: matrix.environment == 'USB_LEAD'
        run: python -m unittest discover -s tests/ota -p 'usb*test*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          include-hidden-files: true
          path: |
            .pio/build/${{ matrix.environment }}/firmware.elf
            .pio/build/${{ matrix.environment }}/firmware.mcuboot.bin
            .pio/build/${{ matrix.environment }}/firmware.mcuboot.json
            .pio/build/${{ matrix.environment }}/zephyr/.config
            .pio/build/${{ matrix.environment }}/zephyr/zephyr.dts
            .pio/build/${{ matrix.environment }}/zephyr/*.map
